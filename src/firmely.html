<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Firmely · Panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233F4FE0'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--blue:#1F5A9B;--blue-dark:#1E3F6F;--blue-light:#2E72B8;--blue-xlight:#E8F0F9;--bg:#F2F4F8;--card:#fff;--text:#0F1C2E;--muted:#5A6A7E;--border:rgba(31,90,155,.12);--field:#fff;--nav-bg:rgba(255,255,255,.92);--hero:#1E3F6F;--ok:#16a34a;--bad:#C0392B;--fd:'DM Serif Display',serif;--fb:'DM Sans',sans-serif;--nav-h:68px;color-scheme:light}
[data-theme=dark]{--blue:#4A90D9;--blue-dark:#2E72B8;--blue-light:#5BA3E8;--blue-xlight:rgba(74,144,217,.12);--bg:#0D1117;--card:#161B22;--text:#E6EDF3;--muted:#8B949E;--border:rgba(74,144,217,.16);--field:#0D1117;--nav-bg:rgba(13,17,23,.92);--hero:#0D1117;--ok:#4ADE80;--bad:#FF8A80;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:var(--fb);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}a{color:var(--blue)}
h1,h2,h3{font-family:var(--fd);font-weight:400}h1{font-size:clamp(30px,5vw,44px);line-height:1.1}h2{font-size:22px}h3{font-family:var(--fb);font-weight:600;font-size:17px}
.muted{color:var(--muted)}.small{font-size:13px}.sp{flex:1}
nav.top{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;gap:12px;padding:0 5%;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
nav.top.hidden{display:none}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none}
.brand img{height:32px;display:block}.brand .lw{display:none}[data-theme=dark] .brand .ld{display:none}[data-theme=dark] .brand .lw{display:block}
.brand small{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--border);padding-left:12px}
.ibtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.ibtn:hover{border-color:var(--blue);background:var(--blue-xlight)}.ibtn svg{width:16px;height:16px;stroke:var(--muted)}.sunI{display:none}[data-theme=dark] .sunI{display:block}[data-theme=dark] .moonI{display:none}
.btn{border:0;border-radius:8px;padding:12px 22px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;letter-spacing:.02em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(31,90,155,.22)}.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn.alt:hover{border-color:var(--blue);box-shadow:none}
.btn.white{background:#fff;color:var(--blue-dark)}.btn.bad{background:var(--bad);color:#fff}.btn.sm{padding:8px 14px;font-size:13px;border-radius:6px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;padding:calc(var(--nav-h) + 56px) 5% 52px}
.hero .pat{position:absolute;inset:0;background:url(/firmely/assets/pattern.png) center/420px;opacity:.07;filter:brightness(0) invert(1)}
.hero .g1{position:absolute;top:-220px;right:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(46,114,184,.45),transparent 70%)}
.hero .g2{position:absolute;bottom:-300px;left:-120px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(31,90,155,.35),transparent 70%)}
.wrap{position:relative;z-index:2;max-width:1160px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:14px}
.hero h1 em{font-style:italic;color:rgba(255,255,255,.65)}.hero p.sub{color:rgba(255,255,255,.65);font-size:16px;max-width:520px;margin-top:12px}
.hero .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin-top:34px;padding-top:26px;border-top:1px solid rgba(255,255,255,.12)}
.stats b{display:block;font:400 34px var(--fd);line-height:1}.stats span{font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.04em}
main{max-width:1160px;margin:0 auto;padding:34px 5% 80px}main.pad{padding-top:calc(var(--nav-h) + 30px)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.card.click{cursor:pointer}.card.click::before,.card.svc:not(.off)::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.card.click:hover,.card.svc:not(.off):hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(31,90,155,.12);border-color:rgba(31,90,155,.25)}.card.click:hover::before,.card.svc:not(.off):hover::before{transform:scaleX(1)}
.card.svc{cursor:pointer}.card.svc.off{opacity:.55;cursor:default}
.row{display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--bg);border:1px solid var(--border);flex:none}.logo.lg{width:76px;height:76px}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--border)}
.tag,.chip{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;letter-spacing:.02em;background:var(--blue-xlight);color:var(--blue)}.chip.off{background:var(--bg);color:var(--muted)}
.crumb{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin-bottom:18px;flex-wrap:wrap}.crumb a{text-decoration:none}.crumb a:hover{color:var(--blue)}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=number],input[type=password],select{width:100%;padding:13px 16px;border-radius:8px;border:1px solid var(--border);background:var(--field);outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--blue)}input::placeholder{color:var(--muted);opacity:.6}
.f2{display:grid;gap:14px;grid-template-columns:1fr 1fr}.f3{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:640px){.f2,.f3{grid-template-columns:1fr}.stats{gap:22px}}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:22px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px}.kpi span{font-size:12px;color:var(--muted);letter-spacing:.04em}.kpi b{display:block;font:400 30px var(--fd);margin-top:4px}
.urlrow{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 8px 8px 14px;min-width:0}.urlrow b{font-size:12px;color:var(--muted);width:80px;flex:none;font-weight:600}.urlrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.colorf{display:flex;gap:8px;align-items:center}.colorf input[type=color]{width:46px;height:44px;padding:2px;border-radius:8px;border:1px solid var(--border);background:var(--field);cursor:pointer;flex:none}.colorf input[type=text]{flex:1;min-width:0}
.auto{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer}.auto input{width:auto}
.err{color:var(--bad);min-height:20px;font-size:14px}.ok{color:var(--ok);font-size:14px}
.mock{border-radius:18px;padding:14px;width:100%;max-width:330px;box-shadow:0 8px 24px rgba(15,28,46,.25)}.mock .mh{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em;font-size:13px}.mock .mh img{width:30px;height:30px;border-radius:50%}
.mock .ms{margin:12px -14px;padding:12px 14px;display:grid;gap:7px}.mock .ms i{aspect-ratio:1;border-radius:50%;border:2px solid;display:block}.mock .mf{display:flex;justify-content:space-between;font-size:12px}
.keybox{background:var(--blue-xlight);border:1px dashed var(--blue);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}.keybox code{font-size:14px;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.66);display:grid;place-items:center;padding:16px;z-index:80}.modal .card{max-width:480px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--blue-dark);color:#fff;padding:11px 20px;border-radius:8px;font-weight:600;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.danger{border-color:rgba(192,57,43,.35)}.two{display:flex;gap:10px;flex-wrap:wrap}
img.strip{width:100%;max-width:420px;border-radius:12px;border:1px solid var(--border)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:var(--hero);color:#fff}
.login .box{position:relative;z-index:2;width:100%;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:16px}
.login .box img{height:46px;margin:0 auto 10px}.login .box p{color:rgba(255,255,255,.6)}
.login input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;text-align:center}.login input::placeholder{color:rgba(255,255,255,.4)}.login input:focus{border-color:rgba(255,255,255,.5)}
.login .err{color:#FFB4AB}
[hidden]{display:none!important}
</style>
</head>
<body>
<nav class="top hidden" id="nav">
  <a class="brand" id="home"><img class="ld" src="/firmely/assets/logo-dark.png" alt="Firmely"><img class="lw" src="/firmely/assets/logo-white.png" alt="Firmely"><small>Panel</small></a>
  <div class="sp"></div>
  <button class="ibtn" id="theme" aria-label="Tema"><svg class="moonI" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg><svg class="sunI" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
  <button class="btn alt sm" id="out">Salir</button>
</nav>
<div id="app"></div>

<script>
const $app = document.getElementById('app');
const $nav = document.getElementById('nav');
try { if (localStorage.getItem('firmely-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch {}
document.getElementById('theme').onclick = () => {
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  if (d) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
  try { localStorage.setItem('firmely-theme', d ? 'light' : 'dark'); } catch {}
};
const page = (...kids) => { $nav.classList.remove('hidden'); $app.replaceChildren(h('main', { class: 'pad' }, ...kids)); window.scrollTo(0, 0); };
let KEY = ''; try { KEY = sessionStorage.getItem('fk') || ''; } catch {}
let CFG = { loyaltyUrl: '' };
let BIZ = [];
const SERVICES = [
  { id: 'loyalty', name: 'Tarjeta de fidelidad', desc: 'Apple y Google Wallet con sellos, avisos y caja.', active: true },
  { id: 'chatbot', name: 'Chatbot con IA', desc: 'Atención automática por WhatsApp.', active: false },
  { id: 'web', name: 'Página web', desc: 'Landing o sitio del negocio.', active: false },
  { id: 'efactura', name: 'Facturación electrónica', desc: 'Comprobantes fiscales (e-CF).', active: false },
];

// ---------- utilidades ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const base = () => (CFG.loyaltyUrl || location.origin).replace(/\/+$/, '');
const slugify = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
let toastT;
function toast(msg) { document.querySelectorAll('.toast').forEach((t) => t.remove()); const t = h('div', { class: 'toast' }, msg); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copiado'); } catch { toast('No se pudo copiar'); } }

async function api(path, opts = {}) {
  const r = await fetch('/firmely/api' + path, { ...opts, headers: { 'content-type': 'application/json', 'x-firmely-key': KEY } });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401) { logout('Llave incorrecta.'); throw new Error('Llave incorrecta.'); }
  if (!r.ok) throw new Error(j.message || 'Error ' + r.status);
  return j;
}
async function download(path, name, btn) {
  const old = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Generando…'; }
  try {
    const r = await fetch('/firmely/api' + path, { headers: { 'x-firmely-key': KEY } });
    if (!r.ok) { let m = 'Error ' + r.status; try { m = (await r.json()).message || m; } catch {} throw new Error(m); }
    const url = URL.createObjectURL(await r.blob());
    const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { toast(e.message); }
  if (btn) { btn.disabled = false; btn.textContent = old; }
}
function logout(msg) { KEY = ''; try { sessionStorage.removeItem('fk'); } catch {} renderLogin(msg); }
document.getElementById('out').onclick = () => logout();
document.getElementById('home').onclick = () => { location.hash = '#/'; };

// ---------- acceso ----------
function renderLogin(msg) {
  $nav.classList.add('hidden');
  const key = h('input', { type: 'password', autocomplete: 'off', placeholder: 'Llave de Firmely', autofocus: true });
  const err = h('div', { class: 'err' }, msg || '');
  const go = async () => {
    KEY = key.value.trim(); err.textContent = '';
    if (!KEY) return;
    try { await api('/config'); try { sessionStorage.setItem('fk', KEY); } catch {} route(); }
    catch (e) { KEY = ''; err.textContent = e.message; }
  };
  key.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $app.replaceChildren(h('div', { class: 'login' }, h('div', { class: 'hero pat', style: 'position:absolute;inset:0;padding:0;background:none' }, h('div', { class: 'pat' }), h('div', { class: 'g1' }), h('div', { class: 'g2' })),
    h('div', { class: 'box' }, h('img', { src: '/firmely/assets/logo-white.png', alt: 'Firmely' }),
      h('h1', {}, 'Panel de ', h('em', {}, 'gestión')), h('p', {}, 'Entra con tu llave para administrar los negocios.'),
      key, h('button', { class: 'btn white', onclick: go }, 'Entrar'), err)));
  key.focus();
}

// ---------- rutas ----------
async function route() {
  if (!KEY) return renderLogin();
  try {
    CFG = await api('/config');
    BIZ = (await api('/businesses')).businesses;
  } catch (e) { if (KEY) page(h('div', { class: 'card' }, h('div', { class: 'err' }, e.message))); return; }
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!p.length) return renderHome();
  if (p[0] === 'nuevo') return renderNew();
  if (p[0] === 'n' && p[1]) {
    const b = BIZ.find((x) => x.slug === p[1]);
    if (!b) { location.hash = '#/'; return; }
    return p[2] === 'loyalty' ? renderLoyalty(b) : renderBusiness(b);
  }
  location.hash = '#/';
}
window.addEventListener('hashchange', route);

// ---------- inicio ----------
const sum = (k) => BIZ.reduce((a, b) => a + b[k], 0);
function renderHome() {
  const q = h('input', { type: 'text', placeholder: 'Buscar negocio…' });
  const grid = h('div', { class: 'grid' });
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    const list = BIZ.filter((b) => !t || b.name.toLowerCase().includes(t) || b.slug.includes(t));
    grid.replaceChildren(...list.map((b) => h('div', { class: 'card biz', onclick: () => { location.hash = `#/n/${b.slug}`; } },
      h('div', { class: 'row' }, h('img', { class: 'logo', src: `/api/${b.slug}/logo.png?v=${Date.now() % 1e6}`, alt: '' }),
        h('div', { style: 'min-width:0' }, h('h3', {}, b.name), h('div', { class: 'muted small' }, b.slug))),
      h('div', { class: 'row small muted' }, `${b.customers} clientes · ${b.visitsThisWeek} visitas esta semana`),
      h('div', { class: 'row' }, h('div', { class: 'dots' }, h('i', { style: `background:${b.brand.bg}` }), h('i', { style: `background:${b.brand.fg}` })),
        h('span', { class: 'chip' }, 'Tarjeta de fidelidad')))));
    if (!list.length) grid.replaceChildren(h('div', { class: 'muted' }, BIZ.length ? 'Ningún negocio coincide.' : 'Aún no hay negocios. Crea el primero.'));
  };
  q.addEventListener('input', draw); draw();
  $nav.classList.remove('hidden'); window.scrollTo(0, 0);
  $app.replaceChildren(
    h('section', { class: 'hero' }, h('div', { class: 'pat' }), h('div', { class: 'g1' }), h('div', { class: 'g2' }),
      h('div', { class: 'wrap' }, h('p', { class: 'eyebrow' }, 'Firmely · Panel de gestión'),
        h('div', { class: 'row' }, h('div', { style: 'flex:1;min-width:260px' }, h('h1', {}, 'Tus ', h('em', {}, 'negocios'), h('br'), 'en un solo lugar'),
          h('p', { class: 'sub' }, 'Crea, configura y administra los servicios de cada cliente.')),
          h('a', { class: 'btn white', href: '#/nuevo' }, '+ Nuevo negocio')),
        h('div', { class: 'stats' }, [['Negocios', BIZ.length], ['Clientes', sum('customers')], ['Visitas · 7 días', sum('visitsThisWeek')], ['Premios canjeados', sum('rewardsRedeemed')]]
          .map(([t, v]) => h('div', {}, h('b', {}, v), h('span', {}, t)))))),
    h('main', {}, q, grid));
}

// ---------- negocio y servicios ----------
const crumb = (...parts) => h('div', { class: 'crumb' }, parts.flatMap((p, i) => [i ? '›' : null, p]));
const home = () => h('a', { href: '#/' }, 'Negocios');
function renderBusiness(b) {
  page(
    crumb(home(), b.name),
    h('div', { class: 'row', style: 'margin-bottom:6px' }, h('img', { class: 'logo lg', src: `/api/${b.slug}/logo.png?v=${Date.now() % 1e6}`, alt: '' }),
      h('div', {}, h('h1', {}, b.name), h('div', { class: 'muted' }, b.slug))),
    h('h2', { style: 'margin:22px 0 12px' }, 'Servicios'),
    h('div', { class: 'grid' }, SERVICES.map((s) => h('div', { class: 'card svc' + (s.active ? '' : ' off'), onclick: s.active ? () => { location.hash = `#/n/${b.slug}/${s.id}`; } : null },
      h('div', { class: 'row' }, h('h3', {}, s.name), h('div', { class: 'sp' }), h('span', { class: 'chip' + (s.active ? '' : ' off') }, s.active ? 'Activo' : 'Próximamente')),
      h('div', { class: 'muted small' }, s.desc),
      s.active ? h('div', { class: 'small' }, `${b.customers} clientes · ${b.visitsThisWeek} visitas esta semana`) : null))));
}

// ---------- formulario de negocio (crear y editar) ----------
const ICONS = [['scissors', 'Tijeras'], ['cup', 'Taza de café'], ['dryer', 'Secador de cabello'], ['drop', 'Gota']];
const mix = (a, b, t) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) + (parseInt(b.slice(i, i + 2), 16) - parseInt(a.slice(i, i + 2), 16)) * t).toString(16).padStart(2, '0')).join('');
const HEX = /^#[0-9a-fA-F]{6}$/;

function colorField(label, value, { optional = false } = {}) {
  const txt = h('input', { type: 'text', value: value || '#000000', maxlength: 7 });
  const pick = h('input', { type: 'color', value: HEX.test(value || '') ? value : '#000000' });
  const auto = optional ? h('input', { type: 'checkbox', checked: !value }) : null;
  const sync = () => { const d = auto && auto.checked; txt.disabled = d; pick.disabled = d; wrap.style.opacity = d ? .45 : 1; };
  pick.addEventListener('input', () => { txt.value = pick.value.toUpperCase(); fire(); });
  txt.addEventListener('input', () => { if (HEX.test(txt.value)) pick.value = txt.value; fire(); });
  let fire = () => {};
  const wrap = h('div', { class: 'colorf' }, pick, txt);
  if (auto) auto.addEventListener('change', () => { sync(); fire(); });
  const el = h('div', {}, h('label', {}, label), wrap, auto ? h('label', { class: 'auto' }, auto, 'Automático') : null);
  sync();
  return { el, get: () => (auto && auto.checked ? null : (HEX.test(txt.value) ? txt.value.toUpperCase() : null)), onchange: (f) => { fire = f; } };
}

function bizForm(b, mode) {
  const br = (b && b.brand) || { bg: '#0F1720', fg: '#FFFFFF', icon: 'scissors' };
  const name = h('input', { type: 'text', maxlength: 40, value: b ? b.name : '', placeholder: 'Ej: Sayonara Beauty' });
  const slug = h('input', { type: 'text', maxlength: 40, value: b ? b.slug : '', placeholder: 'sayonara-beauty', disabled: mode === 'edit' });
  let slugTouched = false;
  slug.addEventListener('input', () => { slugTouched = true; });
  name.addEventListener('input', () => { if (mode === 'create' && !slugTouched) slug.value = slugify(name.value); draw(); });
  const reward = h('input', { type: 'text', maxlength: 60, value: b ? b.reward : '', placeholder: 'Ej: Café gratis' });
  const visits = h('input', { type: 'number', min: 2, max: 24, value: b ? b.visitsRequired : 10 });
  const unit = h('input', { type: 'text', maxlength: 30, value: br.unit || '', placeholder: 'visita' });
  const units = h('input', { type: 'text', maxlength: 30, value: br.units || '', placeholder: 'visitas' });
  const unitsLong = h('input', { type: 'text', maxlength: 30, value: br.unitsLong || '', placeholder: 'visitas (ej. lavadas de cabello)' });
  const minH = h('input', { type: 'number', min: 0, max: 720, value: b ? b.minHoursBetweenVisits : 4 });
  const maxN = h('input', { type: 'number', min: 0, max: 20, value: b ? b.maxNoticesPerMonth : 2 });
  const icon = h('select', {}, ICONS.map(([v, t]) => h('option', { value: v, selected: v === br.icon }, t)));
  const cBg = colorField('Color de fondo', br.bg), cFg = colorField('Color de texto', br.fg);
  const cStrip = colorField('Fondo del recuadro de sellos', br.stripBg, { optional: true });
  const cStamp = colorField('Color de los sellos', br.stamp, { optional: true });
  const cInk = colorField('Color del dibujo en el sello', br.stampInk, { optional: true });
  const file = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp' });
  let logoData = null;
  const logoPrev = h('img', { class: 'logo lg', alt: '', src: b ? `/api/${b.slug}/logo.png?v=${Date.now() % 1e6}` : '', hidden: !b });
  file.addEventListener('change', () => {
    const f = file.files[0]; logoData = null; if (!f) return;
    if (f.size > 3 * 1024 * 1024) { file.value = ''; toast('El logo pesa más de 3 MB'); return; }
    const rd = new FileReader();
    rd.onload = () => { logoData = rd.result; logoPrev.src = rd.result; logoPrev.hidden = false; draw(); };
    rd.readAsDataURL(f);
  });
  // Tipo de tarjeta: sellos (por visita) o puntos (por consumo).
  const bz = b || {};
  const modeSel = h('select', {}, [['stamps', 'Sellos: el cliente junta visitas'], ['points', 'Puntos: el cliente acumula según lo que gasta']]
    .map(([v, t]) => h('option', { value: v, selected: v === (bz.mode || 'stamps') }, t)));
  const per = h('input', { type: 'number', min: 1, max: 100000, value: (bz.points && bz.points.pesosPerPoint) || 100 });
  const rewardRows = h('div', { style: 'display:flex;flex-direction:column;gap:8px' });
  const addReward = (r) => {
    const n = h('input', { type: 'text', maxlength: 40, value: r ? r.name : '', placeholder: 'Ej: Bebida gratis', style: 'flex:2' });
    const c = h('input', { type: 'number', min: 1, max: 100000, value: r ? r.cost : '', placeholder: 'Puntos', style: 'flex:1' });
    const row = h('div', { class: 'row' }, n, c, h('button', { type: 'button', class: 'btn alt sm', onclick: () => { row.remove(); draw(); } }, 'Quitar'));
    row._get = () => ({ id: r && r.id, name: n.value.trim(), cost: Number(c.value) });
    [n, c].forEach((i) => i.addEventListener('input', () => draw()));
    rewardRows.appendChild(row);
  };
  ((bz.points && bz.points.rewards) || []).forEach(addReward);
  const rewardsOut = () => Array.from(rewardRows.children).map((r) => r._get());
  const pointsBox = h('div', { style: 'display:flex;flex-direction:column;gap:12px' },
    h('div', {}, h('label', {}, 'Pesos por cada punto (RD$)'), per, h('div', { class: 'muted small', style: 'margin-top:6px' }, 'Ej: 100 = el cliente gana 1 punto por cada RD$100 de consumo.')),
    h('div', {}, h('label', {}, 'Premios que puede canjear'), rewardRows,
      h('button', { type: 'button', class: 'btn alt sm', style: 'margin-top:8px', onclick: () => addReward(null) }, '+ Agregar premio'),
      mode === 'edit' ? h('div', { class: 'muted small', style: 'margin-top:8px' }, 'Si cambias entre sellos y puntos, los saldos de los clientes se reinician a 0.') : null));
  const stampsOnly = [];
  const isPoints = () => modeSel.value === 'points';
  const mock = h('div', { class: 'mock' });
  function draw() {
    if (isPoints()) {
      const bg = cBg.get() || '#0F1720', fg = cFg.get() || '#FFFFFF';
      const rw = rewardsOut().filter((r) => r.name && r.cost > 0).sort((a, c) => a.cost - c.cost), first = rw[0];
      const pts = first ? Math.round(first.cost * .6) : 30;
      mock.style.background = bg; mock.style.color = fg;
      mock.replaceChildren(
        h('div', { class: 'mh' }, logoPrev.src && !logoPrev.hidden ? h('img', { src: logoPrev.src, alt: '' }) : null, (name.value || 'Tu negocio').toUpperCase()),
        h('div', { class: 'ms', style: `background:${cStrip.get() || mix(bg, fg, .08)};display:block;padding:14px` },
          h('div', { style: 'font-size:34px;font-weight:700;line-height:1' }, String(pts), h('span', { style: 'font-size:14px;font-weight:400;opacity:.75;margin-left:8px' }, 'puntos')),
          h('div', { style: `height:8px;border-radius:4px;background:${fg}38;margin-top:12px` }, h('div', { style: `height:8px;border-radius:4px;background:${cStamp.get() || fg};width:60%` })),
          h('div', { style: 'font-size:12px;opacity:.85;margin-top:6px' }, first ? `${first.cost - pts} pts para ${first.name}` : 'Agrega un premio')),
        h('div', { class: 'mf' }, h('span', {}, 'PRÓXIMO PREMIO'), h('span', {}, 'PUNTOS')),
        h('div', { class: 'mf', style: 'font-size:14px;font-weight:600' }, h('span', {}, first ? first.name : 'Premio'), h('span', {}, String(pts))));
      return;
    }
    const bg = cBg.get() || '#0F1720', fg = cFg.get() || '#FFFFFF';
    const strip = cStrip.get() || mix(bg, fg, .08), stamp = cStamp.get() || fg, ink = cInk.get() || bg;
    const total = Math.min(24, Math.max(2, Number(visits.value) || 10)), done = Math.floor(total / 2);
    mock.style.background = bg; mock.style.color = fg;
    const cols = Math.ceil(total / 2);
    mock.replaceChildren(
      h('div', { class: 'mh' }, logoPrev.src && !logoPrev.hidden ? h('img', { src: logoPrev.src, alt: '' }) : null, (name.value || 'Tu negocio').toUpperCase()),
      h('div', { class: 'ms', style: `background:${strip};grid-template-columns:repeat(${Math.min(cols, 12)},1fr)` },
        Array.from({ length: total }, (_, i) => h('i', { style: i < done ? `background:${stamp};border-color:${stamp}` : `border-color:${stamp};opacity:.55` }))),
      h('div', { class: 'mf' }, h('span', {}, 'RECOMPENSA'), h('span', {}, 'SELLOS')),
      h('div', { class: 'mf', style: 'font-size:14px;font-weight:600' }, h('span', {}, reward.value || 'Premio'), h('span', {}, `${done} de ${total}`)));
  }
  [cBg, cFg, cStrip, cStamp, cInk].forEach((c) => c.onchange(draw));
  [reward, visits, per].forEach((i) => i.addEventListener('input', draw));
  const applyMode = () => { const p = isPoints(); pointsBox.hidden = !p; stampsOnly.forEach((e) => { e.hidden = p; }); draw(); };
  modeSel.addEventListener('change', applyMode);
  const L = (t, el) => h('div', {}, h('label', {}, t), el);
  const rowReward = h('div', { class: 'f2' }, L('Premio', reward), L('Visitas para ganarlo', visits));
  const rowUnits = h('div', { class: 'f3' }, L('Se cuenta (singular)', unit), L('Se cuenta (plural)', units), L('En el cartel (largo)', unitsLong));
  const rowMisc = h('div', { class: 'f3' }, L('Icono de los sellos', icon), L('Horas entre visitas', minH), L('Avisos máx. por mes', maxN));
  stampsOnly.push(rowReward, rowUnits, rowMisc);
  const el = h('div', { style: 'display:flex;flex-direction:column;gap:16px' },
    h('div', { class: mode === 'create' ? 'f2' : '' }, L('Nombre del negocio', name), mode === 'create' ? L('Identificador (se usa en los enlaces y no se puede cambiar)', slug) : null),
    L('Tipo de tarjeta', modeSel),
    rowReward, pointsBox, rowUnits, rowMisc,
    h('div', { class: 'f2' }, cBg.el, cFg.el),
    h('div', { class: 'f3' }, cStrip.el, cStamp.el, cInk.el),
    h('div', { class: 'row', style: 'align-items:flex-start;flex-wrap:wrap' }, h('div', { style: 'flex:1;min-width:230px' }, L('Logo (PNG, JPG o WEBP, hasta 3 MB)', file), h('div', { class: 'muted small', style: 'margin-top:6px' }, 'Se ajusta a un círculo cuadrado sobre el color de fondo.')), logoPrev),
    h('div', {}, h('label', {}, 'Vista previa'), mock));
  applyMode();
  return {
    el,
    values() {
      const t = (i) => (i.value.trim() ? i.value.trim().toLowerCase() : null);
      const pts = isPoints();
      return {
        slug: slug.value.trim(), name: name.value.trim(), mode: modeSel.value,
        ...(pts ? { points: { pesosPerPoint: Number(per.value), rewards: rewardsOut() }, maxNoticesPerMonth: Number(maxN.value) }
          : { reward: reward.value.trim(), visitsRequired: Number(visits.value), minHoursBetweenVisits: Number(minH.value), maxNoticesPerMonth: Number(maxN.value) }),
        brand: { bg: cBg.get(), fg: cFg.get(), icon: icon.value, unit: t(unit), units: t(units), unitsLong: t(unitsLong), stripBg: cStrip.get(), stamp: cStamp.get(), stampInk: cInk.get() },
        ...(logoData ? { logo: logoData } : {}),
      };
    },
  };
}

// ---------- crear negocio ----------
function keyBlock(keys) {
  return h('div', { class: 'keybox' },
    h('b', {}, 'Guarda estas llaves ahora: no se vuelven a mostrar.'),
    [['Caja (escanea y suma visitas)', keys.staff], ['Admin (panel del negocio)', keys.admin]].filter(([, k]) => k).map(([t, k]) =>
      h('div', {}, h('div', { class: 'muted small' }, t), h('div', { class: 'row' }, h('code', { style: 'flex:1' }, k), h('button', { class: 'btn alt sm', onclick: () => copy(k) }, 'Copiar')))),
    h('div', { class: 'muted small' }, 'Úsalas en un gestor de contraseñas.'));
}
function renderNew() {
  const f = bizForm(null, 'create');
  const err = h('div', { class: 'err' });
  const btn = h('button', { class: 'btn' }, 'Crear negocio');
  btn.onclick = async () => {
    err.textContent = ''; btn.disabled = true;
    try {
      const v = f.values();
      for (const k of Object.keys(v.brand)) if (v.brand[k] === null) delete v.brand[k];
      const { business, keys } = await api('/businesses', { method: 'POST', body: JSON.stringify(v) });
      BIZ = (await api('/businesses')).businesses;
      page(crumb(home(), 'Nuevo negocio'),
        h('div', { class: 'card' }, h('h1', {}, `¡${business.name} está listo!`),
          h('p', { class: 'muted', style: 'margin:0' }, 'Ya puede registrar clientes. Comparte el enlace de registro o imprime su cartel con QR.'),
          keyBlock(keys),
          h('div', { class: 'two' }, h('a', { class: 'btn', href: `#/n/${business.slug}/loyalty` }, 'Ir al negocio'), h('a', { class: 'btn alt', href: `#/` }, 'Volver a la lista'))));
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
  };
  page(crumb(home(), 'Nuevo negocio'), h('div', { class: 'card' }, h('h1', {}, 'Nuevo negocio'), f.el, err, btn));
}

// ---------- servicio: tarjeta de fidelidad ----------
function modal(...content) {
  const m = h('div', { class: 'modal', onclick: (e) => { if (e.target === m) m.remove(); } }, h('div', { class: 'card' }, ...content));
  document.body.append(m); return m;
}
function renderLoyalty(b) {
  const u = base();
  const link = (t, url) => h('div', { class: 'urlrow' }, h('b', {}, t), h('code', {}, url),
    h('button', { class: 'btn alt sm', onclick: () => copy(url) }, 'Copiar'), h('a', { class: 'btn alt sm', href: url, target: '_blank', rel: 'noopener' }, 'Abrir'));
  const keysCard = () => {
    const out = h('div');
    const regen = (which, label) => h('button', { class: 'btn alt sm', onclick: () => {
      const m = modal(h('h3', {}, `Regenerar ${label}`), h('p', { class: 'muted', style: 'margin:0' }, 'La llave actual dejará de funcionar de inmediato. Tendrás que dársela de nuevo a quien la use.'),
        h('div', { class: 'two' }, h('button', { class: 'btn bad', onclick: async (e) => {
          e.target.disabled = true;
          try { const { keys } = await api(`/businesses/${b.slug}/keys`, { method: 'POST', body: JSON.stringify({ which }) }); m.querySelector('.card').replaceChildren(h('h3', {}, 'Llave nueva'), keyBlock(keys), h('button', { class: 'btn', onclick: () => m.remove() }, 'Listo')); }
          catch (er) { m.remove(); toast(er.message); }
        } }, 'Sí, regenerar'), h('button', { class: 'btn alt', onclick: () => m.remove() }, 'Cancelar')));
    } }, `Regenerar ${label}`);
    out.append(h('div', { class: 'muted small' }, 'Las llaves no se pueden ver otra vez (se guardan cifradas). Si se pierden, regenéralas.'),
      h('div', { class: 'two' }, regen('staff', 'llave de caja'), regen('admin', 'llave de admin'), regen('both', 'ambas')));
    return out;
  };

  const f = bizForm(b, 'edit');
  const err = h('div', { class: 'err' }), okm = h('div', { class: 'ok' });
  const save = h('button', { class: 'btn' }, 'Guardar cambios');
  const strip = h('img', { class: 'strip', alt: '', src: `/api/${b.slug}/stamp/${Math.floor(b.visitsRequired / 2)}.png?scale=2&v=${Date.now() % 1e6}` });
  save.onclick = async () => {
    err.textContent = ''; okm.textContent = ''; save.disabled = true;
    try {
      const v = f.values(); delete v.slug;
      await api(`/businesses/${b.slug}`, { method: 'PATCH', body: JSON.stringify(v) });
      okm.textContent = 'Guardado. Las tarjetas ya instaladas se actualizan solas.';
      BIZ = (await api('/businesses')).businesses;
      const nb = BIZ.find((x) => x.slug === b.slug); strip.src = `/api/${b.slug}/stamp/${Math.floor(nb.visitsRequired / 2)}.png?scale=2&v=${Date.now()}`;
    } catch (e) { err.textContent = e.message; }
    save.disabled = false;
  };

  const del = () => {
    const c = h('input', { type: 'text', placeholder: b.slug, autocomplete: 'off' });
    const go = h('button', { class: 'btn bad', disabled: true }, 'Eliminar para siempre');
    c.addEventListener('input', () => { go.disabled = c.value.trim() !== b.slug; });
    const m = modal(h('h3', {}, `Eliminar ${b.name}`),
      h('p', { class: 'muted', style: 'margin:0' }, `Se borran sus ${b.customers} clientes, historial, avisos y logo. Las tarjetas que ya estén en los teléfonos dejarán de funcionar. No se puede deshacer.`),
      h('div', {}, h('label', {}, `Escribe "${b.slug}" para confirmar`), c),
      h('div', { class: 'two' }, go, h('button', { class: 'btn alt', onclick: () => m.remove() }, 'Cancelar')));
    go.onclick = async () => {
      go.disabled = true;
      try { await api(`/businesses/${b.slug}`, { method: 'DELETE', body: JSON.stringify({ confirm: c.value.trim() }) }); m.remove(); toast('Negocio eliminado'); location.hash = '#/'; }
      catch (e) { toast(e.message); go.disabled = false; }
    };
  };

  page(
    crumb(home(), h('a', { href: `#/n/${b.slug}` }, b.name), 'Tarjeta de fidelidad'),
    h('div', { class: 'row' }, h('img', { class: 'logo lg', src: `/api/${b.slug}/logo.png?v=${Date.now() % 1e6}`, alt: '' }),
      h('div', {}, h('h1', {}, b.name), h('div', { class: 'muted' }, 'Tarjeta de fidelidad'))),
    h('div', { class: 'kpis' }, [['Clientes', b.customers], [b.mode === 'points' ? 'Compras (7 días)' : 'Visitas (7 días)', b.visitsThisWeek], ['Premios canjeados', b.rewardsRedeemed], [b.mode === 'points' ? 'Premios' : 'Meta', b.mode === 'points' ? b.points.rewards.map((r) => `${r.name} ${r.cost}`).join(' · ') || '—' : `${b.visitsRequired} → ${b.reward}`]]
      .map(([t, v]) => h('div', { class: 'kpi' }, h('span', {}, t), h('b', { style: typeof v === 'string' ? 'font-size:16px;line-height:1.3;padding-top:8px' : '' }, v)))),
    h('div', { style: 'display:flex;flex-direction:column;gap:16px' },
      h('div', { class: 'card' }, h('h2', {}, 'Enlaces'),
        link('Registro', `${u}/r/${b.slug}`), link('Caja', `${u}/caja/${b.slug}`), link('Panel', `${u}/admin/${b.slug}`),
        link('Cartel QR', `${u}/api/${b.slug}/poster.png?download=1`), link('QR (PNG)', `${u}/api/${b.slug}/qr.png`)),
      h('div', { class: 'card' }, h('h2', {}, 'Descargas'),
        h('div', { class: 'muted small' }, 'Paquete: ficha, logo, cartel con QR, QR (PNG y SVG) y una tarjeta de ejemplo. Las llaves no vienen incluidas.'),
        h('div', { class: 'two' },
          h('button', { class: 'btn', onclick: (e) => download(`/businesses/${b.slug}/package.zip`, `Firmely-${b.slug}.zip`, e.currentTarget) }, 'Descargar paquete del negocio'),
          h('button', { class: 'btn alt', onclick: (e) => download(`/businesses/${b.slug}/sample.pkpass`, `${b.slug}-ejemplo.pkpass`, e.currentTarget) }, 'Tarjeta de ejemplo (.pkpass)'))),
      h('div', { class: 'card' }, h('h2', {}, 'Llaves de acceso'), keysCard()),
      h('div', { class: 'card' }, h('h2', {}, 'Apariencia y reglas'), f.el,
        h('div', {}, h('label', {}, 'Así se ve la tarjeta guardada (sellos a la mitad)'), strip), err, okm, save),
      h('div', { class: 'card danger' }, h('h2', {}, 'Zona de peligro'), h('div', { class: 'muted small' }, 'Eliminar el negocio borra todos sus datos.'),
        h('div', {}, h('button', { class: 'btn bad', onclick: del }, 'Eliminar negocio')))));
}

route();
